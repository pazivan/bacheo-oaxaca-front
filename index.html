<!DOCTYPE html>

            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAmKoA3_L2o_AmOa0UrgUMMD_NwvTGe9O4GnW3zlyqxWlAnwFVWfJHo8e0bCPy1tRQ_lSNIdcABwgRZITvRO_fd6-y-q9sCWyIccpJukJSuUvAFrRDo-wv051tAYEP8WjX-YAil33k-nwGJaDVm2GN12KY6VAztN2jWRdVAVH5iX01ZPeCvNHaQCOWR2ykPWsuwKxxRPGOyJEl2ZthR_G_n-FF8zQX3SM-UN9jESikmV5I4C2faCaH9Ut2_t6EExCbR1GmPPQ8jJHJ2);

<body class="bg-background-light font-sans antialiased text-slate-900">
    <div class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden">
        <!-- Subtle Pattern Background -->
        <div class="grecas-bg"></div>
        <div
            class="layout-content-container flex flex-col max-w-[480px] w-full bg-white p-8 md:p-12 rounded-2xl shadow-xl border border-slate-100 relative z-10">
            <!-- Logo Header -->
            <div class="flex flex-col items-center mb-10">
                <img alt="Gobierno de Oaxaca"
                    class="h-32 md:h-40 w-auto mb-6 object-contain drop-shadow-sm transform hover:scale-105 transition-transform duration-300"
                    data-alt="The official institutional shield of the State of Oaxaca..."
                    src="./src/assets/LOGOTIPO-OAXACA.jpeg" />
                <div class="h-1 w-20 bg-primary rounded-full mb-6"></div>
                <h1 class="text-2xl font-bold text-slate-800 text-center tracking-tight">Iniciar Sesión</h1>
                <p class="text-slate-500 text-sm mt-2 text-center">Acceso restringido a personal autorizado</p>
            </div>
            <!-- Login Form -->
            <form id="form-login" class="space-y-5">
                <div class="flex flex-col gap-1.5">
                    <label class="text-slate-700 text-sm font-semibold ml-1">Correo electrónico</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">mail</span>
                        </div>
                        <input id="email"
                            class="flex w-full rounded-xl border-slate-200 bg-slate-50 pl-11 pr-4 py-3.5 text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-slate-400"
                            placeholder="usuario@oaxaca.gob.mx" required="" type="email" />
                    </div>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-slate-700 text-sm font-semibold ml-1">Contraseña</label>
                    <div
                        class="relative flex items-center rounded-xl overflow-hidden border border-slate-200 bg-slate-50 group focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/20 transition-all">
                        <div
                            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </div>
                        <input id="password"
                            class="flex w-full bg-transparent border-none pl-11 pr-12 py-3.5 text-slate-900 focus:ring-0 placeholder:text-slate-400"
                            placeholder="••••••••" required="" type="password" />
                        <button
                            class="absolute right-0 top-0 bottom-0 px-4 text-slate-400 hover:text-primary transition-colors"
                            data-icon="visibility" data-weight="regular" type="button"
                            onclick="togglePasswordVisibility()">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input class="rounded border-slate-300 text-primary focus:ring-primary/20 cursor-pointer"
                            type="checkbox" />
                        <span
                            class="text-sm text-slate-600 group-hover:text-slate-800 transition-colors">Recordarme</span>
                    </label>
                    <a class="text-sm font-medium text-primary hover:text-primary-dark transition-colors"
                        href="#">¿Olvidó su contraseña?</a>
                </div>
                <button
                    class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2"
                    type="submit">
                    <span>Entrar al Sistema</span>
                    <span class="material-symbols-outlined text-[20px]">login</span>
                </button>
            </form>
            <!-- Footer Links -->
            <div class="mt-10 pt-8 border-t border-slate-100 text-center">

                </a>
            </div>
        </div>
    </div>
    <!-- System Decorative Elements -->
    <div
        class="fixed bottom-6 left-1/2 -translate-x-1/2 text-slate-400 text-[10px] font-medium tracking-tight uppercase whitespace-nowrap z-0">
        © 2024 Gobierno del Estado de Oaxaca | Dirección de Tecnologías de la Información
    </div>
    </div>
    <script>
        // Estos datos simulan lo que enviará su algoritmo Stitch/IA desde Java
        const callesPrioritarias = [
            { id: 1, nombre: "Av. Universidad 120", colonia: "Copilco", prioridad: "Crítico", baches: 31, costo: "110,000", riesgo: "Riesgo alto para transporte público." },
            { id: 2, nombre: "Calle 5 de Mayo", colonia: "Centro Histórico", prioridad: "Crítico", baches: 24, costo: "85,000", riesgo: "Zona de alto flujo peatonal y turístico." },
            { id: 3, nombre: "Calzada de Tlalpan", colonia: "Portales", prioridad: "Medio", baches: 18, costo: "62,000", riesgo: "Desgaste moderado en carril derecho." },
            { id: 4, nombre: "Av. Insurgentes Sur", colonia: "Mixcoac", prioridad: "Medio", baches: 12, costo: "45,000", riesgo: "Grietas longitudinales detectadas." },
            // Aquí pueden llegar hasta las 40 calles requeridas
        ];

        const tabla = document.getElementById('tabla-prioridades');

        function renderizarTabla() {
            tabla.innerHTML = ""; // Limpiamos la tabla
            callesPrioritarias.forEach(calle => {
                const colorBadge = calle.prioridad === "Crítico" ? "bg-red-50 text-red-700 border-red-100" : "bg-yellow-50 text-yellow-700 border-yellow-100";
                const colorPunto = calle.prioridad === "Crítico" ? "bg-red-600" : "bg-yellow-600";

                const fila = `
                <tr class="hover:bg-gray-50 transition-colors cursor-pointer" onclick="seleccionarCalle(${calle.id})">
                    <td class="px-6 py-4 text-sm font-medium text-gray-900">${calle.nombre}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${calle.colonia}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold ${colorBadge} border">
                            <span class="size-1.5 rounded-full ${colorPunto}"></span> ${calle.prioridad}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm"><button class="text-primary font-bold hover:text-primary-dark">Detalles</button></td>
                </tr>
            `;
                tabla.innerHTML += fila;
            });
        }

        function seleccionarCalle(id) {
            const info = callesPrioritarias.find(c => c.id === id);
            if (!info) return;

            // Actualizamos los contadores del panel derecho
            document.querySelector('.text-3xl.font-black.text-gray-900').textContent = info.baches;
            document.querySelectorAll('.text-3xl.font-black.text-gray-900')[1].textContent = `$${info.costo}`;

            // Actualizamos el texto del análisis IA
            document.querySelector('.text-sm.opacity-90.leading-relaxed').innerHTML = `
            <strong>Análisis para ${info.nombre}:</strong> ${info.riesgo} 
            Se recomienda enviar cuadrilla de respuesta inmediata.
        `;
        }

        // Form submission logic
        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === 'admi@gmail.com' && password === '123456') {
                window.location.href = 'dashboard.html';
            } else {
                alert('Correo electrónico o contraseña incorrectos.');
            }
        });

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('[data-icon="visibility"] span');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Arrancamos la tabla al cargar
        if (tabla) {
            renderizarTabla();
            seleccionarCalle(1); // Seleccionamos la primera por defecto
        }
    </script>
</body>
<tfoot class="bg-gray-50 border-t border-gray-100">
    <tr>
        <td colspan="4" class="px-6 py-4 text-xs text-center text-gray-400 font-medium tracking-wide uppercase">
            Sistema desarrollado por Ivan Paz Cruz
        </td>
    </tr>
</tfoot>

</html>
